<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Amjad Islamic School</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;500;600;700;800&display=swap');

:root{
  --p-indigo-950:#1F0E17;
  --p-indigo-900:#341527;
  --p-gold-600:#A8752A;
  --p-gold-500:#E3B049;
  --p-gold-100:#FCEFD3;
  --p-paper-50:#FDFBF5;
  --p-ink-900:#231320;
  --p-ink-600:#6E4C5E;
  --p-line:#E6D6DE;
  --p-gold-foil: linear-gradient(100deg, var(--p-gold-600) 0%, var(--p-gold-500) 22%, #FFEFC2 45%, var(--p-gold-500) 68%, var(--p-gold-600) 100%);
  --p-danger:#B4405A;
  --p-radius:16px;
  --p-ease: cubic-bezier(.22,.9,.32,1.1);
  --p-shadow: 0 1px 2px rgba(31,14,23,.06), 0 18px 40px rgba(31,14,23,.12), 0 4px 16px rgba(168,117,42,.10);
}
*{box-sizing:border-box;}
body{
  margin:0;font-family:'Cairo', sans-serif;background:var(--p-paper-50);color:var(--p-ink-900);
  min-height:100vh;
}
h1,h2,h3{font-family:'Amiri', serif;font-weight:700;margin:0;color:var(--p-indigo-900);}
a{color:inherit;}
.gold-foil{
  background:var(--p-gold-foil);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:foil-sheen 7s ease-in-out infinite;
}
@keyframes foil-sheen{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}

/* ---------- Page-load reveal sequence ---------- */
@keyframes p-fade-down{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}
@keyframes p-card-rise{from{opacity:0;transform:translateY(26px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes p-avatar-pop{
  0%{opacity:0;transform:scale(.4) rotate(-12deg);}
  60%{opacity:1;transform:scale(1.08) rotate(3deg);}
  100%{opacity:1;transform:scale(1) rotate(0deg);}
}
@keyframes p-avatar-ring{
  0%{box-shadow:0 0 0 0 rgba(227,176,73,.45);}
  100%{box-shadow:0 0 0 14px rgba(227,176,73,0);}
}
@keyframes p-item-in{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
@keyframes p-spin{to{transform:rotate(360deg);}}
@keyframes p-fade-in{from{opacity:0;}to{opacity:1;}}

header.p-topbar{
  background:var(--p-indigo-950);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;
  animation:p-fade-down .6s var(--p-ease) both;
}
.p-brand{display:flex;align-items:center;gap:12px;}
.p-brand img{width:64px;height:64px;object-fit:contain;}
.p-brand span{color:#fff;font-family:'Amiri',serif;font-size:17px;font-weight:700;}
.p-home-link{color:#F0E2DE;font-size:13.5px;font-weight:600;text-decoration:none;opacity:.9;transition:opacity .2s ease, gap .2s ease;display:inline-flex;gap:7px;align-items:center;}
.p-home-link:hover{opacity:1;gap:11px;color:var(--p-gold-500);}
.p-logout{background:none;border:1.5px solid var(--p-gold-500);color:var(--p-gold-500);border-radius:20px;padding:7px 18px;font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer;transition:all .2s var(--p-ease);}
.p-logout:hover{background:var(--p-gold-500);color:var(--p-indigo-950);transform:translateY(-2px);}

.p-wrap{max-width:760px;margin:0 auto;padding:56px 24px 80px;}
.p-loading{text-align:center;padding:80px 20px;color:var(--p-ink-600);animation:p-fade-in .4s ease both;}
.p-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--p-line);border-top-color:var(--p-gold-500);animation:p-spin 0.8s linear infinite;margin:0 auto 18px;}

.p-card{
  background:#fff;border:1px solid var(--p-line);border-radius:var(--p-radius);
  padding:36px 34px;box-shadow:var(--p-shadow);
  animation:p-card-rise .65s var(--p-ease) both;
}
.p-avatar{
  width:78px;height:78px;border-radius:50%;background:var(--p-gold-100);border:2px solid var(--p-gold-500);
  display:flex;align-items:center;justify-content:center;font-family:'Amiri',serif;font-size:32px;color:var(--p-gold-600);
  margin-bottom:18px;
  animation:p-avatar-pop .7s var(--p-ease) .18s both, p-avatar-ring 1.8s ease-out .85s;
}
.p-card h2{font-size:24px;margin-bottom:4px;opacity:0;animation:p-fade-down .5s var(--p-ease) .32s forwards;}
.p-card .p-sub{color:var(--p-ink-600);font-size:14px;margin:0 0 26px;opacity:0;animation:p-fade-down .5s var(--p-ease) .4s forwards;}

.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.p-item{
  border:1px solid var(--p-line);border-radius:12px;padding:14px 16px;background:var(--p-paper-50);
  opacity:0;animation:p-item-in .5s var(--p-ease) both;
  transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
}
.p-item:hover{border-color:var(--p-gold-500);transform:translateY(-2px);box-shadow:0 6px 16px rgba(168,117,42,.12);}
.p-item:nth-child(1){animation-delay:.48s;}
.p-item:nth-child(2){animation-delay:.56s;}
.p-item:nth-child(3){animation-delay:.64s;}
.p-item:nth-child(4){animation-delay:.72s;}
.p-item:nth-child(5){animation-delay:.8s;}
.p-item label{display:block;font-size:12px;color:var(--p-ink-600);font-weight:600;margin-bottom:4px;}
.p-item div{font-size:14.5px;font-weight:600;}

.p-role-tag{
  display:inline-block;margin-bottom:10px;padding:4px 12px;border-radius:20px;
  font-size:12px;font-weight:700;letter-spacing:.02em;
  background:var(--p-gold-100);color:var(--p-gold-600);border:1px solid var(--p-gold-500);
}
.p-role-tag.teacher{background:var(--p-indigo-950);color:var(--p-gold-500);border-color:var(--p-indigo-950);}

.p-alert{border-radius:10px;padding:14px 16px;font-size:13.5px;margin-bottom:18px;display:none;align-items:flex-start;gap:8px;line-height:1.6;}
.p-alert.show{display:flex;animation:p-card-rise .4s var(--p-ease) both;}
.p-alert.warn{background:#FBEAEE;border:1px solid #EFC3CD;color:#8F2D45;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}

@media (max-width: 600px){ .p-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header class="p-topbar">
  <a class="p-home-link" href="../index.html">← Home Page</a>
  <div class="p-brand">
    <img src="https://cdn.phototourl.com/free/2026-09-10-76f22a95-a83e-469b-b00b-f9d405e3ab72.png" alt="Amjad Islamic School logo">
    <span>Amjad Islamic School</span>
  </div>
  <button class="p-logout" id="logoutBtn">Log Out</button>
</header>

<div class="p-wrap">

  <div class="p-loading" id="loadingState">
    <div class="p-spin"></div>
    <div>Loading your profile...</div>
  </div>

  <div class="p-alert warn" id="profileError"></div>

  <div class="p-card" id="profileCard" style="display:none;">
    <div class="p-avatar" id="avatarInitial">A</div>
    <span class="p-role-tag" id="roleTag" style="display:none;"></span>
    <h2 class="gold-foil" id="profileName">—</h2>
    <p class="p-sub">Welcome to your personal profile.</p>

    <div class="p-grid">
      <div class="p-item"><label>Role</label><div id="fRole">—</div></div>
      <div class="p-item"><label>Email</label><div id="fEmail">—</div></div>
      <div class="p-item"><label>Age</label><div id="fAge">—</div></div>
      <div class="p-item"><label>Phone</label><div id="fPhone">—</div></div>
      <div class="p-item"><label>WhatsApp</label><div id="fWhatsapp">—</div></div>
      <div class="p-item"><label>Alternate Contact</label><div id="fAltPhone">—</div></div>
    </div>
  </div>

</div>

<script>
  // ============================================
  // Google Sheets backend (Google Apps Script Web App)
  // ============================================
  // Paste the deployment URL of your Apps Script web app here.
  // See the accompanying Code.gs file for the backend script to deploy.
  const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbynO8A4cXKBMSvEeL5LZhJuA5KUVrQXiTs8L9HHy0oPUM_iEWU-Ts37YXn95Wm8MQ6rIQ/exec';

  const AMJAD_PROFILE_KEY = 'amjad_profile';
  const AMJAD_SESSION_KEY = 'amjad_member_email';

  function getSession(){ return localStorage.getItem(AMJAD_SESSION_KEY); }
  function getCachedProfile(){
    try{
      const raw = localStorage.getItem(AMJAD_PROFILE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(err){ return null; }
  }
  function cacheProfile(profile){ localStorage.setItem(AMJAD_PROFILE_KEY, JSON.stringify(profile)); }

  // The ONLY network call this page ever makes — and only when there is
  // no cached profile yet. Every future visit renders straight from
  // localStorage, so the page stays fast and the Google Sheet stays light.
  async function fetchProfileFromSheet(email){
    const url = SHEET_API_URL + '?action=find&email=' + encodeURIComponent(email);
    const res = await fetch(url, { method: 'GET' });
    if(!res.ok) throw new Error('network_error');
    const data = await res.json();
    if(data && data.found) return data.profile;
    return null;
  }

  function renderProfile(profile){
    const name = profile['Full Name'] || profile.fullName || 'Member';
    document.getElementById('avatarInitial').textContent = name.trim().charAt(0).toUpperCase() || 'A';
    document.getElementById('profileName').textContent = name;

    const role = profile['Role'] || profile.role || '';
    const roleTag = document.getElementById('roleTag');
    if(role){
      roleTag.textContent = role === 'Teacher' ? 'Teacher' : role;
      roleTag.classList.toggle('teacher', role === 'Teacher');
      roleTag.style.display = 'inline-block';
    }
    document.getElementById('fRole').textContent = role || '—';

    document.getElementById('fEmail').textContent = profile['Email'] || profile.email || '—';
    document.getElementById('fAge').textContent = profile['Age'] || profile.age || '—';
    document.getElementById('fPhone').textContent = profile['Phone'] || profile.phone || '—';
    document.getElementById('fWhatsapp').textContent = profile['WhatsApp'] || profile.whatsapp || '—';
    document.getElementById('fAltPhone').textContent = profile['Alt Phone'] || profile.altPhone || '—';

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('profileCard').style.display = 'block';
  }

  function showError(message){
    document.getElementById('loadingState').style.display = 'none';
    const err = document.getElementById('profileError');
    err.innerHTML = message;
    err.classList.add('show');
  }

  (async function init(){
    const session = getSession();
    if(!session){
      window.location.href = 'login.html';
      return;
    }

    const cached = getCachedProfile();
    if(cached){
      // Fast path: no network call at all.
      renderProfile(cached);
      return;
    }

    // First-time load (e.g. session cookie present but cache was cleared):
    // fetch once from the Google Sheet, then cache for every visit after this.
    if(SHEET_API_URL.indexOf('PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') !== -1){
      showError('Backend not configured yet: paste your Google Apps Script Web App URL into SHEET_API_URL in this file.');
      return;
    }

    try{
      const profile = await fetchProfileFromSheet(session);
      if(!profile){
        showError('We couldn\'t find your data. Please <a class="p-link" href="login.html">log in again</a>.');
        return;
      }
      cacheProfile(profile);
      renderProfile(profile);
    }catch(err){
      console.error(err);
      showError('An unexpected error occurred while loading your profile. Please try again later.');
    }
  })();

  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    localStorage.removeItem(AMJAD_SESSION_KEY);
    localStorage.removeItem(AMJAD_PROFILE_KEY);
    window.location.href = 'login.html';
  });
</script>

</body>
</html>
